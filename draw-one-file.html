<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公平共享抽签</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#172033;margin:0;padding:22px}main{max-width:480px;margin:40px auto;background:white;border-radius:20px;padding:24px;box-shadow:0 10px 35px #182b4414}h1{margin:0 0 10px}.hint{color:#64748b;font-size:14px;line-height:1.7}.number{text-align:center;font-size:112px;font-weight:800;color:#2563eb;min-height:150px}.controls{display:flex;gap:8px;margin:14px 0}input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;background:#2563eb;color:#fff;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e8eef8;color:#1e40af}.full{width:100%;margin-top:8px}.status{font-size:13px;color:#475569;min-height:22px}small{color:#64748b}</style></head><body><main><h1>🎲 公平共享抽签</h1><p class="hint">仅从 2、3、4、5、6 中随机抽取。相同房间的所有人共享同一结果。</p><div class="controls"><input id="room" maxlength="24" placeholder="房间号，如 8888"><button id="join">进入房间</button></div><div id="number" class="number">—</div><p id="status" class="status">请输入房间号，进入后即可抽签。</p><button id="draw" class="full" disabled>随机抽签（2–6）</button><button id="share" class="full secondary" disabled>复制房间分享链接</button><p class="hint">提示：任何进入房间的人都能重新抽签；结果约每 3 秒自动同步。请勿把房间号当作密码。</p></main><script>window.DRAW_CONFIG = {
  supabaseUrl: 'https://ldbhlyqvvbjvtqczyvcd.supabase.co',
  supabaseAnonKey: 'sb_publishable_NCs6gh_b3c38kW-cMhoRcw_MKtoUgn2'
};
</script><script>
const $=id=>document.getElementById(id), cfg=window.DRAW_CONFIG||{}, base=(cfg.supabaseUrl||'').replace(/\/$/,''), key=cfg.supabaseAnonKey||'';let room='',timer=null,busy=false;
function status(s){$('status').textContent=s}function ready(){return /^https:\/\/.+\.supabase\.co$/.test(base)&&key.length>25&&!key.includes('在这里')}function valid(s){return /^[A-Za-z0-9_-]{3,24}$/.test(s)}
async function request(path, options={}){const r=await fetch(base+'/rest/v1/'+path,{...options,headers:{'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){let t=await r.text();throw Error('服务器返回 '+r.status+'：'+t.slice(0,150))}return r.status===204?null:r.json()}
async function getRoom(){const rows=await request('draw_rooms?room_id=eq.'+encodeURIComponent(room)+'&select=result&limit=1');return rows.length?rows[0].result:null}
async function pickRoom(){const n=2+Math.floor(Math.random()*5);const rows=await request('draw_rooms?on_conflict=room_id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify({room_id:room,result:n,updated_at:new Date().toISOString()})});return rows[0].result}
async function refresh(){if(!room||busy)return;try{const result=await getRoom();$('number').textContent=result===null?'—':result;status(result===null?'房间已连接，尚未抽签。':'房间已同步，当前结果：'+result)}catch(e){status('同步失败：'+e.message)}}
async function join(){let v=$('room').value.trim();if(!valid(v)){status('房间号需为 3–24 位英文字母、数字、- 或 _');return}if(!ready()){status('尚未配置 Supabase。请先按照说明填写 config.js');return}room=v;history.replaceState(null,'','#room='+encodeURIComponent(room));$('draw').disabled=false;$('share').disabled=false;clearInterval(timer);await refresh();timer=setInterval(refresh,3000)}
$('join').onclick=join;$('draw').onclick=async()=>{if(!room||busy)return;busy=true;$('draw').disabled=true;status('正在抽签…');try{const result=await pickRoom();$('number').textContent=result;status('抽签成功！已保存到共享房间。')}catch(e){status('抽签失败：'+e.message)}finally{busy=false;$('draw').disabled=false}};
$('share').onclick=async()=>{const link=location.origin+location.pathname+'#room='+encodeURIComponent(room);try{await navigator.clipboard.writeText(link);status('房间链接已复制，可以发到微信群。')}catch(e){prompt('请长按复制这个链接',link)}};
const m=location.hash.match(/^#room=([A-Za-z0-9_-]{3,24})$/);if(m){$('room').value=m[1];join()}else if(!ready())status('网页尚未配置数据库，请先按部署说明操作。');
</script></body></html>
